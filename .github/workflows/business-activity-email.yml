name: Business activity email guidance
on:
  push:
    branches: [feat/business-activity-guidance]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --prefix /tmp/bp-email-contracts typescript@5.9.3 --ignore-scripts --no-audit --no-fund
          ln -s /tmp/bp-email-contracts/node_modules node_modules
          node --experimental-vm-modules --test tests/business-activity-recipients.test.mjs
      - run: deno test --no-config tests/business-activity-email.test.ts tests/business-migration-email.test.ts
      - run: deno check --no-config supabase/functions/send-email/index.ts supabase/functions/admin-email-ops/index.ts
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Verify live email sources before targeted deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BUSINESS_ACTIVITY_DEPLOY_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import os,json,urllib.request
          url='https://api.supabase.com/v1/projects/orwrcpwsffjlvzuraxjc/functions'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']})
          versions={f['slug']:f['version'] for f in json.load(urllib.request.urlopen(req))}
          assert versions['send-email']==456 and versions['admin-email-ops']==295, 'Live source changed; re-audit required'
          CHECK
          supabase functions deploy admin-email-ops --project-ref orwrcpwsffjlvzuraxjc --no-verify-jwt --use-api
