name: Business setup profile checks
on:
  push:
    branches: [fix/paused-business-review-view]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:synthetic_test_password@localhost:5432/profile_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/get-user-profile/index.ts
      - name: Verify setup state, private data and provider state
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/setup-profile/paused-fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003010000_paused_business_review_workspace.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003020000_review_after_secure_link.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/setup-profile/paused-assertions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/setup-profile/fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261003030000_local_profile_setup_context.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/setup-profile/assertions.sql
