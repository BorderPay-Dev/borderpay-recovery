name: Provider business onboarding boundary
on:
  push:
    branches: [fix/provider-business-onboarding-boundary]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-config --allow-read --allow-env tests/provider-business-boundary.test.ts tests/hosted-verification-resume-http.test.ts tests/signup-boundary.test.ts tests/signup-captcha-config.test.ts
      - run: deno check --no-config supabase/functions/bridge-customer/index.ts supabase/functions/bridge-kyc-link/index.ts supabase/functions/bridge-kyb-link/index.ts
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Check live versions and deploy only onboarding boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROVIDER_BOUNDARY_DEPLOY_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import json,os,urllib.request
          root='https://api.supabase.com/v1/projects/orwrcpwsffjlvzuraxjc/'
          def get(path):
            return json.load(urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']})))
          versions={f['slug']:f['version'] for f in get('functions')}
          for name,version in {'bridge-customer':328,'bridge-kyc-link':345,'bridge-kyb-link':370}.items():
            assert versions[name]==version,name+' changed since audit'
          assert get('config/auth')['disable_signup'] is True,'Raw Auth signup must stay disabled'
          CHECK
          supabase functions deploy bridge-kyb-link --project-ref orwrcpwsffjlvzuraxjc --no-verify-jwt --use-api
