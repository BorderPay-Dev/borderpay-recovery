name: Verified business maintenance
on:
  push:
    branches: [fix/verified-business-maintenance]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: billing_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test invoice eligibility and payment preservation on synthetic PostgreSQL
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f tests/sql/automatic-business-maintenance-fixture.sql
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261001120000_automatic_verified_business_maintenance.sql
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f tests/sql/automatic-business-maintenance-acceptance.sql
      - run: deno check --no-config supabase/functions/subscription-billing-worker/index.ts
      - run: deno test --no-config --allow-env tests/maintenance-email-capacity.test.ts
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Apply only the reviewed maintenance migration and worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MAINTENANCE_DEPLOY_TOKEN }}
        run: |
          python3 - <<'CHECK'
          import os,json,urllib.request,hashlib,pathlib
          base='https://api.supabase.com/v1/projects/orwrcpwsffjlvzuraxjc/'
          def api(path,body=None):
            req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'})
            return json.load(urllib.request.urlopen(req,timeout=60))
          versions={f['slug']:f['version'] for f in api('functions')}
          assert versions['subscription-billing-worker']==140,'Worker changed; re-audit before deployment'
          row=api('database/query',{'query':"select pg_get_functiondef('public.maintenance_account_is_billable(uuid)'::regprocedure) as definition",'read_only':True})[0]
          assert hashlib.sha256(row['definition'].encode()).hexdigest()=='9a580b7f208cedf085d782dbb8adc40162caadd4806c73f8ac235ccb7c69208d','Eligibility changed; re-audit before deployment'
          api('database/query',{'query':pathlib.Path('supabase/migrations/20261001120000_automatic_verified_business_maintenance.sql').read_text(),'read_only':False})
          print('Reviewed maintenance migration applied; no collection batch executed')
          CHECK
          supabase functions deploy subscription-billing-worker --project-ref orwrcpwsffjlvzuraxjc --no-verify-jwt --use-api
