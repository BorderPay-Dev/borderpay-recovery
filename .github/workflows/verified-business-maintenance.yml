name: Verified business maintenance
on:
  push:
    branches: [fix/verified-business-maintenance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: billing_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test invoice eligibility and payment preservation on synthetic PostgreSQL
        env:
          PGPASSWORD: synthetic-test-only
        run: |
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f tests/sql/automatic-business-maintenance-fixture.sql
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261001120000_automatic_verified_business_maintenance.sql
          psql -h localhost -U postgres -d billing_test -v ON_ERROR_STOP=1 -f tests/sql/automatic-business-maintenance-acceptance.sql
      - run: deno check --no-config supabase/functions/subscription-billing-worker/index.ts
      - run: deno test --no-config --allow-env tests/maintenance-email-capacity.test.ts
