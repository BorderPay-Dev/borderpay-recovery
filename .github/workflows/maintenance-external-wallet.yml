name: Maintenance external wallet eligibility
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261015010000_bill_active_va_external_wallet_businesses.sql'
      - 'tests/sql/maintenance-external-wallet-*.sql'
      - '.github/workflows/maintenance-external-wallet.yml'
permissions:
  contents: read
jobs:
  eligibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: maintenance_external_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_external_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: maintenance_external_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/maintenance-external-wallet-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015010000_bill_active_va_external_wallet_businesses.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/maintenance-external-wallet-regression.sql
