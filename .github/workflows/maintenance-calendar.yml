name: Maintenance calendar safety
on:
  pull_request:
    paths:
      - 'supabase/functions/subscription-billing-worker/**'
      - 'supabase/functions/maintenance-invoice-renderer/**'
      - 'supabase/functions/flutterwave-subscription-collection/**'
      - 'supabase/functions/_shared/maintenance*.ts'
      - 'supabase/functions/_shared/subscription-email-policy.ts'
      - 'supabase/functions/_shared/email-templates/subscription/**'
      - 'tests/maintenance-calendar.test.ts'
      - 'tests/maintenance-access-policy.test.ts'
      - 'tests/sql/maintenance-reactivation*.sql'
      - 'supabase/migrations/20261014010000_maintenance_reactivation_status.sql'
      - 'supabase/functions/bridge-reconcile-accounts/**'
      - '.github/workflows/maintenance-calendar.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-config --node-modules-dir=none tests/maintenance-calendar.test.ts tests/maintenance-access-policy.test.ts
      - run: deno check --no-config --node-modules-dir=none supabase/functions/subscription-billing-worker/index.ts supabase/functions/send-email/index.ts supabase/functions/flutterwave-subscription-collection/index.ts supabase/functions/maintenance-invoice-renderer/index.ts supabase/functions/bridge-reconcile-accounts/index.ts
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: maintenance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic_ci_only
      PGDATABASE: maintenance_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify maintenance reactivation on synthetic data
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/maintenance-reactivation-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014010000_maintenance_reactivation_status.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/maintenance-reactivation-regression.sql
