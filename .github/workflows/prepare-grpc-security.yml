name: Prepare gRPC security lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/provider-business-onboarding-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin patched gRPC dependency without upgrading Firebase
        run: |
          python3 - <<'PATCH'
          import json,subprocess
          version=json.loads(subprocess.check_output(['npm','view','@grpc/grpc-js','version','--json']))
          parts=tuple(map(int,version.split('.')))
          assert parts[0]==1 and parts >= (1,13,6), 'Review gRPC release before override'
          p=json.load(open('package.json'))
          p.setdefault('overrides',{})['@grpc/grpc-js']=version
          open('package.json','w').write(json.dumps(p,indent=2)+'\n')
          print('Pinning patched @grpc/grpc-js',version)
          PATCH
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
      - name: Commit only dependency manifest and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'Pin patched gRPC dependency without changing Firebase release'
          git push origin HEAD:fix/provider-business-onboarding-boundary
