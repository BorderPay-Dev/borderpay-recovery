name: Business partner API release
on:
  push:
    branches: [fix/business-only-partner-api]
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy the two tested onboarding functions
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify business eligibility, tenant isolation, payment authorization and aliases
        run: deno test --no-config --allow-env --allow-read --allow-net tests/business-partner-policy.test.ts tests/api-customer-runtime.test.ts
      - name: Type-check deployed entrypoints
        run: deno check --no-config supabase/functions/public-api-gateway/index.ts supabase/functions/auth-signup/index.ts
      - name: Build and test public SDK
        working-directory: docs/api/sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm run build
          node test/customer.conformance.mjs
          node test/webhook.conformance.mjs
      - name: Validate and package public docs
        run: |
          python3 scripts/ci/verify_api_contract_pack.py
          python3 scripts/ci/verify_api_mock_fixtures.py
          python3 scripts/ci/build_public_business_docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: business-partner-docs
          path: dist-partner-docs/
          retention-days: 7
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only business signup and partner API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BUSINESS_API_DEPLOY_TOKEN }}
        run: |
          supabase functions deploy auth-signup --project-ref orwrcpwsffjlvzuraxjc --no-verify-jwt --use-api
          supabase functions deploy public-api-gateway --project-ref orwrcpwsffjlvzuraxjc --no-verify-jwt --use-api
